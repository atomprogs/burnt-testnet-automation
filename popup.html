<!DOCTYPE html>
<html>
  <head>
    <title>Burnt Dashboard Automator</title>
    <style>
      body {
        width: 300px;
        padding: 10px;
        font-family: Arial, sans-serif;
      }
      label {
        display: block;
        margin-top: 10px;
      }
      input {
        width: 100%;
        margin-bottom: 10px;
      }
      button {
        width: 100%;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <h2>Automator Settings</h2>
    <label for="recipientAddress">Recipient Address:</label>
    <input type="text" id="recipientAddress" />
    <label for="minIterations">Min Iterations:</label>
    <input type="number" id="minIterations" min="25" max="35" />
    <label for="maxIterations">Max Iterations:</label>
    <input type="number" id="maxIterations" min="25" max="35" />
    <label for="minAmount">Min Amount:</label>
    <input type="number" id="minAmount" step="0.001" />
    <label for="maxAmount">Max Amount:</label>
    <input type="number" id="maxAmount" step="0.001" />
    <button id="saveConfig">Save Configuration</button>
    <hr />
    <h3>Daily Stats</h3>
    <p id="statsDisplay"></p>
    <script src="popup.js"></script>
  </body>
</html>
